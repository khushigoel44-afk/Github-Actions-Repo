name: Scan_Image

on: 
    workflow_call:

jobs: 
    scan_image:
        runs-on: ubuntu-latest
        steps:
            - name: login to dockerhub
              uses: docker/login-action@v3 
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@0.33.1
              with:
                  severity: 'CRITICAL'
                  exit_code: '1'