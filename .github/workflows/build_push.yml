name: Code_Build_Push

on: 
    workflow_call:

jobs:
    Build_push:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4

            - name: login to dockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and Push Code 
              uses: docker/build-push-action@v6
              with:
                  context: .
                  tags: |
                      ${{ vars.DOCKERHUB_USER }}/flask_app_image: ${{ github.ref_name }} # Branch Name
                      ${{ vars.DOCKERHUB_USER }}/flask_app_image: latest
                      ${{ vars.DOCKERHUB_USER }}/flask_app_image: ${{ github.sha }} # Commit ID