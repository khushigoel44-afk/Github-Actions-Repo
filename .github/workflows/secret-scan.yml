name: Secret_Scan 

on: 
    workflow_call

jobs:
    secrets_scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 
              with:
                  fetch_depth:0

            - name: Run Gitleaks scanner
              uses: gitleaks/gitleaks-action@v2
              env: 
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}