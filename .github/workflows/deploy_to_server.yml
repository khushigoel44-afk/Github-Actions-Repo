name: Deploy_to_Server

on: 
    workflow_call:

jobs: 
    deploy_Server:
        runs-on: ubuntu-latest
        steps:
          - name: Validate Secrets Context
            run: |
              echo "Checking if secrets are reaching the reusable workflow..."
              if [ -z "${{ secrets.HOSTNAME_EC2 }}" ]; then echo "❌ HOSTNAME_EC2 is EMPTY"; else echo "✅ HOSTNAME_EC2 is present (Length: ${#HOSTNAME_EC2})"; fi
              if [ -z "${{ secrets.USERNAME_EC2 }}" ]; then echo "❌ USERNAME_EC2 is EMPTY"; else echo "✅ USERNAME_EC2 is present (Length: ${#USERNAME_EC2})"; fi
              if [ -z "${{ secrets.PRIVATEKEY_EC2 }}" ]; then echo "❌ PRIVATEKEY_EC2 is EMPTY"; else echo "✅ PRIVATEKEY_EC2 is present (Length: ${#PRIVATEKEY_EC2})"; fi
          - name: SSH to deploy_Server
            uses: appleboy/ssh-action@v1.0.3
            with: 
                host: ${{ secrets.HOSTNAME_EC2 }}
                username: ${{ secrets.USERNAME_EC2 }}
                key: ${{ secrets.PRIVATEKEY_EC2 }}
                script: |
                    echo "Starting Deployment"
                    mkdir Devops