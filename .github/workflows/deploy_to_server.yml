name: Deploy_to_Server

on: 
  workflow_call:

jobs: 
  deploy_Server:
    runs-on: ubuntu-latest  # Targets your active green EC2 runner
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Executing SSh using appleboy
        uses: appleboy/ssh-actions@v1.0.3
        with: 
          host: ${{ secrets.HOSTNAME_EC2 }}
          username: ${{ secrets.USERNAME_EC2 }}
          key: ${{ secrets.PRIVATEKEY_EC2 }}
        run: |
          echo "Executing native bash directly inside the EC2 machine environment!"
          cd ~
          mkdir -p Devops
          echo "Directory verification and setup complete."