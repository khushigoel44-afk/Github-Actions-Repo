name: Deploy Flask App

on: 
    workflow_dispatch:

env:
    DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy with Docker Compose
              run: docker compose up --build  # Deploy The application using Docker Compose