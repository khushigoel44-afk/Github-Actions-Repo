name: Dependencies_scan

on: 
    workflow_call:

jobs:
    dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Python 
              uses: actions/setup-python@v3 
              with:
                  python-version: "3.12"

            - name: Install Audit
              run: pip install pip-Audit

            - name: audit Dependencies
              run: pip audit -r requirements.txt
